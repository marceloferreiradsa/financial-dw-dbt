packages:
  # Utilitarios: surrogate_key, unique_combination_of_columns, date_spine, pivot
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]

  # Testes avancados: expect_column_values_to_be_between, expect_row_count_to_equal, etc.
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<1.0.0"]

  # Auditoria de refactoring: compara resultados antes/depois de mudancas em modelos
  - package: dbt-labs/audit_helper
    version: [">=0.12.0", "<1.0.0"]

  # Geracao automatica de YAML para sources e models (uso no desenvolvimento)
  - package: dbt-labs/codegen
    version: [">=0.12.0", "<1.0.0"]
