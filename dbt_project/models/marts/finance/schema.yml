version: 2

models:
  - name: mart_macro_indicators
    description: >
      Mart de indicadores macroeconomicos consolidados para consumo por dashboards e BI.
      Filtra apenas dias uteis BACEN e adiciona metricas derivadas: IPCA acumulado 12 meses
      e variacao mensal do cambio. Ponto de consumo final para analises macroeconomicas.
    columns:
      - name: macro_date
        description: "Data de referencia. Apenas dias uteis BACEN (Selic publicada)."
        tests: [not_null, unique]
      - name: selic_rate
        description: "Taxa Selic diaria em % a.a."
      - name: usd_brl_rate
        description: "Taxa de cambio USD/BRL (venda) do dia."
      - name: cdi_rate
        description: "Taxa CDI diaria em % a.a."
      - name: ipca_monthly_pct
        description: "Variacao percentual mensal do IPCA. NULL fora do primeiro dia util de cada mes."
      - name: igpm_monthly_pct
        description: "Variacao percentual mensal do IGP-M. NULL fora do primeiro dia util de cada mes."
      - name: real_interest_rate
        description: "Juro real ex-ante mensal em % a.a. NULL fora do primeiro dia util de cada mes."
      - name: is_bacen_business_day
        description: "Sempre true neste mart pois filtramos apenas dias uteis BACEN."
      - name: ipca_accumulated_12m_pct
        description: >
          IPCA acumulado nos ultimos 12 meses em percentual.
          Calculado via exp(sum(ln(1 + ipca/100))) para evitar produto em janela,
          que nao e suportado nativamente em SQL. Equivale ao produto de (1 + var_mensal).
      - name: usd_brl_monthly_change_pct
        description: >
          Variacao percentual do cambio USD/BRL em ~21 dias uteis (aproximacao de 1 mes).
          Positivo indica desvalorizacao do Real; negativo indica valorizacao.
      - name: dbt_updated_at
        description: "Timestamp da ultima execucao do dbt que gerou ou atualizou este registro."
        tests: [not_null]
