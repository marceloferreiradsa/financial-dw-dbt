version: 2

models:
  - name: stg_bacen_series
    description: "Series macroeconomicas BACEN normalizadas. Uma linha por (series_code, reference_date)."
    columns:
      - name: series_code
        tests: [not_null]
      - name: reference_date
        tests: [not_null]
      - name: series_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -50
              max_value: 10000
      - name: frequency
        tests:
          - accepted_values:
              values: [daily, monthly]

  - name: stg_market_prices
    description: "Cotacoes diarias OHLCV com retorno logaritmico. Ajustada por dividendos/splits via adj_close."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]
    columns:
      - name: ticker
        tests: [not_null]
      - name: trade_date
        tests: [not_null]
      - name: price_close
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.01
              max_value: 100000
      - name: price_adj_close
        tests: [not_null]
