name: Deploy dbt Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create CI profiles
        run: |
          mkdir -p ~/.dbt
          printf 'financial_dw:\n  target: ci\n  outputs:\n    ci:\n      type: duckdb\n      path: ":memory:"\n      threads: 2\n' > ~/.dbt/profiles.yml
      - run: dbt deps
        working-directory: dbt_project
      - run: dbt docs generate --profiles-dir ~/.dbt
        working-directory: dbt_project
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_project/target/
      - id: deployment
        uses: actions/deploy-pages@v4
