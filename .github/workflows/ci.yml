name: dbt CI Pipeline

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'dbt_project/**'
      - 'ingestion/**'
      - 'requirements.txt'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    name: dbt Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILES'
          financial_dw:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ":memory:"
                threads: 2
                extensions: [httpfs, json]
          PROFILES

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt compile (syntax check)
        working-directory: dbt_project
        run: dbt compile --profiles-dir ~/.dbt

      - name: dbt build (modified + downstream)
        working-directory: dbt_project
        run: |
          dbt build \
            --select state:modified+ \
            --profiles-dir ~/.dbt \
            --defer \
            --state ./target \
          || dbt build --profiles-dir ~/.dbt

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts-${{ github.sha }}
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
          retention-days: 30

  sqlfluff-lint:
    name: SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sqlfluff
        run: pip install sqlfluff==3.3.1 sqlfluff-templater-dbt==3.3.1 dbt-core==1.9.4 dbt-duckdb==1.9.2

      - name: Create profiles.yml for lint
        run: |
          mkdir -p ${{ github.workspace }}/.dbt
          cat > ${{ github.workspace }}/.dbt/profiles.yml << 'PROFILES'
          financial_dw:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ":memory:"
                threads: 2
                extensions: [httpfs, json]
          PROFILES

      - name: dbt deps (for templater)
        working-directory: dbt_project
        run: dbt deps --profiles-dir ${{ github.workspace }}/.dbt

      - name: Lint SQL
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
        run: |
          sqlfluff lint dbt_project/models/ \
            --dialect duckdb \
            --templater dbt \
            --format github-annotation \
            --annotation-level warning
