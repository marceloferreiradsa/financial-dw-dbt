version: "3.8"

# ── Bloco reutilizável via âncora YAML ───────────────────────────────────────
# &airflow-common define o bloco; <<: *airflow-common cola o conteúdo.
# Usado em webserver, scheduler e init para evitar repetição de ~30 linhas.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    # Executor: LocalExecutor roda tasks em subprocessos no mesmo container
    # do scheduler. Sem Redis, sem workers separados — certo para este projeto.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Metastore: onde o Airflow persiste estado interno (histórico, conexões, etc.)
    # Usando Postgres — mais robusto que SQLite (default) para evitar lock errors.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Chave Fernet: criptografa credenciais salvas na UI do Airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"

    # Chave secreta do Flask: assina cookies de sessão da UI
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"

    # Desativa os ~20 DAGs de exemplo que poluem a UI
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Onde o scheduler procura arquivos de DAG
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

    # Configuração do Cosmos: usa subprocess para rodar dbt
    # (mais compatível com todos os adapters do que Python import)
    AIRFLOW__COSMOS__DBT_EXECUTABLE_PATH: /home/airflow/.local/bin/dbt

    # Variáveis passadas para os scripts de ingestão e DAG
    DUCKDB_PATH: /opt/airflow/data/financial_dw.duckdb
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    BACEN_START_DATE: "${BACEN_START_DATE:-2020-01-01}"
    TICKERS: "${TICKERS:-PETR4.SA,VALE3.SA,ITUB4.SA,BBDC4.SA,WEGE3.SA,MGLU3.SA}"

  volumes:
    # Bind mounts: código que você edita no VSCode → container vê imediatamente
    - ../dbt_project:/opt/airflow/dbt_project
    - ../ingestion:/opt/airflow/ingestion
    - ./dags:/opt/airflow/dags

    # Volume nomeado: DuckDB persiste entre restarts, gerenciado pelo Docker
    - duckdb-data:/opt/airflow/data

  depends_on:
    postgres:
      condition: service_healthy

  env_file:
    - .env.airflow

# ── Serviços ──────────────────────────────────────────────────────────────────
services:

  # Metastore do Airflow — guarda todo o estado interno
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bootstrap: roda UMA VEZ para criar tabelas no metastore e o usuário admin.
  # restart: "no" garante que não roda novamente em docker-compose restart.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Aguardando Postgres ficar saudável..."
        airflow db migrate

        echo "Criando usuário admin..."
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          2>/dev/null || echo "Usuário já existe, pulando criação."

        echo "Criando conexão DuckDB para o Cosmos..."
        airflow connections add duckdb_default \
          --conn-type generic \
          --conn-extra "{\"path\": \"/opt/airflow/data/financial_dw.duckdb\"}" \
          2>/dev/null || echo "Conexão já existe, pulando criação."

        echo "Init concluído."
    restart: "no"

  # Webserver: Flask app que serve a UI na porta 8080
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Scheduler: lê DAG files, decide o que rodar e quando.
  # Com LocalExecutor, também executa as tasks (sem workers separados).
  # Não expõe porta — comunicação apenas interna via Postgres.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--limit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  # Metastore do Airflow — tabelas internas de estado
  postgres-data:

  # Banco DuckDB com todos os dados financeiros
  # ATENÇÃO: 'docker-compose down -v' APAGA este volume e todos os dados.
  # Use apenas 'docker-compose down' para parar sem perder dados.
  duckdb-data:
