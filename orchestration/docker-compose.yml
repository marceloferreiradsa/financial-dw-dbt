# ── Bloco reutilizavel via ancora YAML ───────────────────────────────────────
# &airflow-common define o bloco; <<: *airflow-common cola o conteudo.
# Usado em webserver, scheduler e init para evitar repeticao de ~30 linhas.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    # Executor: LocalExecutor roda tasks em subprocessos no mesmo container
    # do scheduler. Sem Redis, sem workers separados.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Metastore: Postgres para persistir estado interno do Airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # Chave Fernet: criptografa credenciais salvas na UI do Airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"

    # Chave secreta do Flask: assina cookies de sessao da UI
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"

    # Desativa os ~20 DAGs de exemplo
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Onde o scheduler procura arquivos de DAG
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags

    # Cosmos: aponta para o dbt no venv isolado
    AIRFLOW__COSMOS__DBT_EXECUTABLE_PATH: /home/airflow/dbt-env/bin/dbt

    # Variaveis passadas para os scripts de ingestao e DAG
    DUCKDB_PATH: /opt/airflow/data/financial_dw.duckdb
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    BACEN_START_DATE: "${BACEN_START_DATE:-2020-01-01}"
    TICKERS: "${TICKERS:-PETR4,MGLU3,VALE3,ITUB4}"

  volumes:
    # Bind mounts: codigo editavel no VSCode → container ve imediatamente
    - ../dbt_project:/opt/airflow/dbt_project
    - ../ingestion:/opt/airflow/ingestion
    - ./dags:/opt/airflow/dags

    # Volume nomeado: DuckDB persiste entre restarts
    - duckdb-data:/opt/airflow/data

  depends_on:
    postgres:
      condition: service_healthy

  env_file:
    - .env

# ── Servicos ──────────────────────────────────────────────────────────────────
services:

  # Metastore do Airflow
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bootstrap: roda UMA VEZ para criar tabelas e usuario admin
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Aguardando Postgres ficar saudavel..."
        airflow db migrate

        echo "Criando usuario admin..."
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" \
          2>/dev/null || echo "Usuario ja existe, pulando criacao."

        echo "Criando conexao DuckDB para o Cosmos..."
        airflow connections add duckdb_default \
          --conn-type generic \
          --conn-extra "{\"path\": \"/opt/airflow/data/financial_dw.duckdb\"}" \
          2>/dev/null || echo "Conexao ja existe, pulando criacao."

        echo "Init concluido."
    restart: "no"

  # Webserver: Flask app que serve a UI na porta 8080
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Scheduler: le DAG files, decide o que rodar e quando
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--limit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  postgres-data:
  duckdb-data:
    # ATENCAO: 'docker compose down -v' APAGA este volume e todos os dados.
    # Use apenas 'docker compose down' para parar sem perder dados.
